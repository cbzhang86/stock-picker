# ============================================================
# A股智能选股系统 — 核心配置
# ============================================================

# ---- 短线策略权重 ----
# ⚠️ 权重加载优先级（见 SKILL.md 陷阱 21）：
#   **data/weights/v1.json  >  本段 short_term.weights  >  ScoringModel.DEFAULT_WEIGHTS**
#   → 本段是 **兜底（fallback）**：当 v1.json 存在时本段不生效；一旦 v1.json 丢失/
#     损坏，本段会立即接管，因此**必须与 v1.json 保持完全一致**（Σ=1.00）。
#   （2026-09-14 曾发生本段停留在旧值、与 v1.json 严重不一致的隐患：一旦回落会与
#     动态门槛 强市65/中性70/弱市75 的评分尺度错配，选股行为静默剧变。）
#   当前生效值（v1.json short，2026-09-18 最佳配置）：hot_theme 0.46 /
#   reversal_20d 0.46 / capital_flow 0.02 / technical 0.02 / volume_price 0.02 /
#   momentum 0.00 / dragon_tiger 0.02 / north_flow 0.00 / size 0.00。
#   权重调整唯一入口：python scripts/calibrate_weights.py（--apply 需人工审批）。
#
# 首次校准依据（2026-06-30~2026-09-03，47 交易日 / 889 只，主口径 hold1d，历史存档）：
#   hot_theme      OOS IC +0.0651 (t=+2.17) ← 唯一统计显著的有效因子
#   capital_flow   OOS IC +0.0056 (t=+0.11) ← 三种口径方向一致，弱正
#   dragon_tiger   OOS IC -0.0072            ← 噪声
#   volume_price   OOS IC -0.0460 (t=-2.08) ← 稳定反向
#   technical      OOS IC -0.0462 (t=-1.81) ← 负向
#   momentum       OOS IC -0.0926 (t=-2.24) ← 强反向（原权重 25%，本次降至 4%）
#
# 原权重来自"A股量化研报中位数"，与本系统实测方向严重背离。现改为按 IC 校准，
# 并向等权先验收缩（λ=0.25，样本外仅 15 天，不宜激进）。
#
# 注意：ScoringModel 加载优先级 v1.json > config.yml > DEFAULT_WEIGHTS。
# 本段是「兜底」，必须与 data/weights/v1.json 保持一致——2026-09-14 整体审查 P1-1：
# 此前本段停留在「资金权重时代」的旧值（capital_flow 0.3036 / technical 0.0619 /
# volume_price 0.062），与生效权重差异巨大；一旦 v1.json 丢失/被清空，就会静默回落到
# 旧参数，而动态门槛（强市 65 / 中性 70 / 弱市 75）是按 v1 的评分尺度定的
# → 评分尺度与门槛错配、选股行为静默剧变。已同步为 v1.json 值（Σ=1.00）。
# 改动此处后必须同步 data/weights/v1.json，否则不生效（SKILL.md 陷阱 21）。
short_term:
  # 影子推荐（2026-09-18）：极端市况（极差市停推 / 拥挤度断路器 / 动态门槛零达标）当日
  # **照常评分并以 mode='shadow' 落库**，但不下发、不进正式统计（全工程 7 处统计读取硬滤
  # mode='short'；get_pending_outcomes 不滤 mode → 影子行自动补 T+1/T+5/T+20 结果）。
  # 目的：破解"样本删失"——停推日不落库 → 永远攒不出"冰点期该不该推"的直接证据。
  # 置 false 可关闭（关闭后恢复"极端日直接停推、不落库"的旧行为）。
  shadow_enabled: true
  weights:
    # 2026-09-19 权重优化（方案G·保守混合，用户决策后定稿）：
    # 口径 = ret_hold1d（T 日尾盘买入 → T+1 收盘卖，与实盘"尾盘买入"一致）。
    # 证据（2024-01~2026-09，299.9万行/647天/5225只，剔除接近涨停，扣全部成本）：
    #   G 方案 Top5 日均超额 +1.845%（t=21.4），旧基线（hot/rev 等权）+0.850%（t=9.4）。
    #   训练/持有切分（≤2025-08 寻优 / ≥2025-09 验证）：500 组随机搜索 + 坐标精修
    #   的训练期最优解持有期 +1.754%，反而低于 G 的 +1.768% → G 已在持有期前沿，
    #   训练期寻优不能显著超越手工设定的 G（过拟合防护通过）。
    # - liq_dev 0→0.14（新增，方案G 核心增量）：缩量偏离因子，当日成交额相对自身
    #   60 日常态的偏离取反。IC +0.0654 / ICIR 0.535 / t +12.81，与规模代理相关
    #   仅 -0.088（正交）。注意：原始 liquidity(−log amount) 84% 是小市值效应
    #   （与规模代理相关 0.838），故 liquidity 保持 0 不启用。
    # - vol_dev 0→0.07（新增）：波动收敛偏离因子。IC +0.0263 / ICIR 0.225 / t +5.37。
    # - hot_theme 0.42→0.55：热点股可买子集 T+1 平均 +1.72%（全市场 -0.23%），
    #   稀疏二值信号尾部置信度高；旧配比把非热点极端反转股放进 Top5 拖累收益
    # - reversal_20d 0.42→0.10：与 liq_dev 相关 0.530（缩量与下跌同步），且单独
    #   加权会把非热点反转股挤进 Top5（纯 rev 方案 F 几乎不赚钱）
    # - momentum/technical/volume_price 0.03→0.02、dragon_tiger 0.02→0.01、
    #   capital_flow 0.05→0.01：保留小权重噪声腿（用户决策"不归零"，实证代价
    #   仅 0.031 pp/日）；OOS IC 分别 -0.0346/-0.0251/-0.0172/-0.0019/+0.0057
    capital_flow: 0.01          # 主力资金流（OOS IC 弱正但 coverage 历史仅 0.19%，保留探索位）
    north_flow: 0.00            # 北向资金（2024-08 政策停公开，因子返回中性 50）
    momentum: 0.02              # 动量（与 reversal_20d 完全共线 ρ=−1，噪声腿）
    technical: 0.02             # 技术形态（OOS 近似含 56% 动量成分 → 弱负 IC，噪声腿）
    volume_price: 0.02          # 量价配合（OOS IC -0.0172，噪声腿）
    hot_theme: 0.55             # 题材热度（2026-09-19 方案G：主导腿，热点池内由新因子排序）
    dragon_tiger: 0.01          # 龙虎榜信号（OOS IC -0.0019，噪声腿）
    reversal_20d: 0.10          # 反转因子（与 liq_dev 相关 0.530，压缩以防重复计数）
    size: 0.00                  # 小市值因子（权重 0 链路先行，对标 Barra Size）
    liquidity: 0.00             # 原始流动性因子（2026-09-19 证伪：与规模代理相关 0.838，
                                # 84% 是小市值效应；由 liq_dev 替代，本键保留 0 不启用）
    volatility: 0.06            # 波动率因子（2026-09-19 方案G：低波动溢价成立，IC +0.0467）
    liq_dev: 0.14               # 缩量偏离因子（2026-09-19 方案G 新增，OOS 验证启用）
    vol_dev: 0.07               # 波动收敛偏离因子（2026-09-19 方案G 新增，OOS 验证启用）
                                # （低波动溢价），权重 0 链路先行，启用条件同上                  # 小市值因子（2026-09-18 R-B，权重 0 链路先行）：横截面市值
                                # 百分位取反，市值越小分越高（study-vault F09：A 股最稳健截面
                                # 因子，现体系无规模维度）。OOS 面板无市值数据，启用条件 =
                                # 市值历史快照积累 >= 60 交易日后跑 OOS 验证再审批加权。
    # ---- 待验证新因子（权重 0，链路已通，验证后再启用）----
    valuation_fundamental: 0.00 # 通达信估值/基本面：PE/PB/ROE/股息率（见 core/fundamental_provider.py）
    event_catalyst: 0.00        # 事件催化：公告/业绩预告/新闻（见 core/event_provider.py）
    # 合计 1.00。
    # 新因子启用条件：data/cache 下积累 >= 60 个交易日的估值/事件快照后，
    # 跑 `python scripts/run_backtest.py --mode oos` 计算其 OOS IC，
    # 再跑 `python scripts/calibrate_weights.py` 重新分配权重。
    # 未经 OOS 验证就给权重 = 盲押，与「①先修验证方法」的原则冲突。

  # 买入条件
  buy:
    max_candidates: 3         # 最多推荐数量
    min_score: 75             # 最低评分（0-100），低于此值跳过
    exclude_st: true
    exclude_limit_up: true    # 涨停封死的股票（2026-09-05 P0-E：limit_up_amount 无数据源，
                              # 改用代理规则 pct_chg >= 板块上限×0.98 直接硬过滤）
    min_volume: 30000000      # 最低日成交额（3000万）
    min_listing_days: 60      # 最低上市天数
    momentum_filter_rps_max: 80  # 动量硬过滤：剔除非热点·rps_20>=80（候选池分位）的票。
                                 # 实测该段胜率 40.3%/日均-1.09%（n=7370）；热点票豁免。0=关闭
    max_per_board: 2          # 组合层风控：推荐组合内同板块最多 N 只（0=关闭）
    max_correlation: 0.85     # 组合层风控③：持仓两两 20 日收益相关上限（0=关闭；0.85 仅拦极端同质持仓）
    # P3（2026-09-18）：拥挤度断路器——全市场日均涨幅（绝对值）≥ 此阈值时当日停推。
    # 依据 run52 分解（4-8 月 111 笔）：市场日均涨幅 >=2.0% 的决策日 9 笔 0 胜
    # （−4.52%/笔，合计 −40.7pp）；机制 = 暴涨日尾盘追题材 → 次日拥挤回落
    # （study-vault F02 拥挤度）。0=关闭。A/B：回测 --crowding-avg-pct 覆盖。
    crowding_avg_pct: 2.0
    # R1（2026-09-18）：拥挤度分档仓位压缩——[[市场日均涨幅阈值, 仓位系数], ...]。
    # 【默认关闭】原因：回测组合模拟按「当日委托合计」归一化（alloc×base_equity/total_alloc），
    # 刻意做到尺度不变（tests/test_portfolio_sim_scale_invariance_20260916.py 锁定），
    # 因此仓位/sizing 类改动在回测中【无法验证】——实测同一窗口「均匀缩放 ×0.5」与
    # 不缩放结果完全相同（+3.23% vs +3.23%），而分档混合缩放会因延期买入与当日买入
    # 混合导致归一化分母失真，产出 −30.76% 的**伪结果**（非真实风险效应）。
    # 若要启用，需先建立「绝对仓位口径」的回测模式（见 docs/下一步工作方案 修订记录）。
    # 机制与单测已就绪（_crowding_position_scale + tests/test_crowding_scale_20260918.py）。
    crowding_scale_levels: []
    # 弱市仓位系数（2026-09-18 参数化，原硬编码 0.5）：弱市时总仓位 × 此系数，
    # 1.0 = 关闭弱市压缩。与波动保险丝/连亏压缩/拥挤度分档共同构成仓位机制栈，
    # 其效果只有在 sizing_mode=absolute 口径下才可被回测验证（见该字段注释）。
    weak_market_scale: 0.5
    # P4（2026-09-18）：尾盘急拉过滤——收盘位置 (close-low)/(high-low) 高于阈值
    # 的票剔除（0=关闭）。【默认关闭】A/B 结论（run61 vs run62）：过滤器确实
    # 剔除了差票（被过滤 43 笔均值 −1.20%），但顶替上来的 40 笔更差（−1.50%）
    # ——候选池整体边际≈0 时，过滤只是弱票换位，组合收益 −19.11%→−47.77%。
    # 待候选池质量改善（size/估值因子启用、覆盖率提升）后再 A/B 启用。
    max_close_pos: 0
    vol_breaker_median_abs: 3.0  # 波动率保险丝：全市场中位|涨幅|% 超过此值触发降仓（历史极罕见）
    vol_breaker_scale: 0.8    # 波动率保险丝触发后的仓位系数
    losing_streak_days: 3     # 组合层风控：最近 N 个有结果交易日日均收益连续为负触发降仓
    losing_streak_scale: 0.5  # 触发连亏降仓后的仓位系数
    # 策略级 kill-switch（2026-09-05 审查报告 P3-R）：
    # 最近 N 个有 T+1 结果的交易日累计收益 <= -drawdown 时停止当日推荐。
    # drawdown 用小数（0.10 = 10%），0 = 关闭。样本不足时自动放行不误伤。
    killswitch_window_days: 20
    killswitch_drawdown: 0.10

  # 卖出规则
  sell:
    take_profit: 0.02         # 止盈 +2%
    stop_loss: -0.02          # 止损 -2%
    time_stop_days: 3         # 时间止损（T+3）
    # 波动率自适应止损（2026-09-05 审查报告 P2-N）：
    #   fixed = 固定 stop_loss（默认，行为与历史一致）
    #   atr   = max(atr_mult × ATR14, |stop_loss|)，热点票噪音止损减少
    stop_mode: fixed
    atr_mult: 1.0
    # 因子横截面标准化（2026-09-05 审查报告 P2-K，实验开关）：
    # true = 评分前对因子做横截面百分位标准化（rank 0-100）。
    # 默认 false 保持历史行为；启用后必须重跑 --mode oos 与 calibrate_weights。
    standardize: false

# ---- 长线策略权重 ----
long_term:
  weights:
    fundamental: 0.40           # 基本面（吸收原 north_flow 10%，长线最稳定信号源）
    north_flow: 0.00            # 北向资金（2024-08 政策停公开，因子恒返回 50 中性值，不占权重）
    momentum: 0.25              # 中期动量（60/120日RPS，吸收另一半 north_flow 10%，长线增强动量权重）
    valuation: 0.20           # 估值水位（PB+PS+股息率，分位指标，不含 PE）
    institutional: 0.15       # 机构动向（龙虎榜机构+大股东增减持）

  hold_period:
    min_months: 3
    max_months: 6

  # 买入条件
  buy:
    max_candidates: 5         # 最多推荐数量
    min_score: 65             # 最低评分（0-100），低于此值跳过

# ---- 模型迭代 ----
model:
  version_dir: data/weights
  min_records_for_optimize: 60   # 至少积累60条推荐记录才触发优化

# ---- 回测 ----
backtest:
  initial_capital: 1000000       # 初始资金
  # 仓位口径（2026-09-18）：normalized=按当日委托合计归一化（默认，尺度不变，
  # 只衡量选股质量）/ absolute=按 alloc% 绝对投入（未投出留现金，超配按比例收缩）。
  sizing_mode: normalized
  # 涨跌停可成交性建模（2026-09-18 全项目审查 P2-2）：true = T+1 开盘涨停不买入、
  # 持有期一字跌停不可卖（顺延到下一交易日）；false = 复现历史口径（未建模）。
  tradability_check: true
  commission_rate: 0.0003         # 手续费万三
  slippage: 0.001                 # 滑点 0.1%
  # ---- 交易成本补全（2026-09-05 审查报告 P0-C：原配置漏计印花税/过户费，
  #      每笔双边成本低估约 0.051%，T+5 口径收益被高估）----
  stamp_duty: 0.0005              # 印花税 0.05%（仅卖出收取，2023-08 减半后现行税率）
  transfer_fee: 0.00001           # 过户费 0.001%（买卖双向）
  # 分级滑点 [[单笔委托金额上限(元), 滑点], ...] 升序；非空时覆盖固定 slippage。
  # ⚠️ 2026-09-17 修复（缺陷1）：滑点按【单笔委托金额】查表，不是股票日成交额；
  #   与 scripts/capacity_check.py::lookup_slippage 同语义。大额单笔按市场冲击分级，
  #   避免 0.1% 统一滑点低估大单成本（报告 P0-C）。
  slippage_tiers:
    - [2000000, 0.001]            # 单笔≤200万：0.1%
    - [10000000, 0.002]           # 单笔 200万~1000万：0.2%
    - [100000000, 0.004]          # 单笔 1000万~1亿：0.4%
    - [1000000000000, 0.008]      # 单笔 >1亿：0.8%
  # ---- 多基准（2026-09-05 审查报告 P1-J：仅沪深300 会掩盖小盘池超额，
  #      中证1000 与小市值候选池更可比；失败自动跳过，不阻断回测）----
  benchmark_codes: ['399300', '000852']

# ---- 推送 ----
notifications:
  console: true                  # 控制台输出

# ---- 维护任务 ----
maintenance:
  # 周日全市场 K 线预取（2026-09-17 T10）：kline_cache 覆盖曾塌缩（5月4587→9月43），
  # 每周日追加一次全市场 K 线预取（脚本自带断点续传，仅补增量），防止覆盖再塌缩。
  # 默认开；置 false 可关闭。
  weekly_kline_prefetch: true
  # 每日市值/估值快照（2026-09-18 P5 数据线）：腾讯行情全市场 PE/PB/总市值/流通市值
  # 落库到 factor_daily.db::valuation_snapshot，零 ASHareHub 配额。用于为 size（精确
  # 市值）与估值（PE/PB）因子积累 point-in-time 历史，累计 ≥60 交易日可进 OOS 验证。
  # 默认开；置 false 可关闭。
  daily_valuation_snapshot: true
  # predictions.db 每日备份（2026-09-18 审查 P1-3）：sqlite backup API 一致快照 →
  # data/backup/predictions_YYYYMMDD.db，保留最近 14 份。主任务前执行（失败不阻断）。
  daily_db_backup: true
